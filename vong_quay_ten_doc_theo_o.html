<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vòng quay may mắn</title><style>body{margin:0;background:radial-gradient(circle at top,#273b86,#10152e 75%);font-family:Arial,sans-serif;color:white;text-align:center}h1{font-size:clamp(26px,5vw,48px);color:#ffdb68;text-shadow:0 3px 12px #000;margin:22px 0}.wrap{max-width:1050px;margin:auto;padding:12px}.layout{display:flex;flex-wrap:wrap;justify-content:center;gap:26px;align-items:center}.wheelbox{position:relative;width:min(88vw,540px);aspect-ratio:1}.wheelbox canvas{width:100%;height:100%;filter:drop-shadow(0 0 20px #f7ba4a)}.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:44px;color:#ffe477;text-shadow:0 2px 5px black;z-index:2}.panel{width:min(90vw,340px);background:#ffffff16;border:1px solid #ffffff40;border-radius:18px;padding:20px;box-sizing:border-box}textarea,select{box-sizing:border-box;width:100%;border-radius:10px;padding:12px;font-size:16px;background:#fff;color:#172047;border:0}textarea{height:190px;resize:vertical}button{background:linear-gradient(120deg,#ffdf68,#ff9b36);color:#2a1838;font-size:18px;font-weight:bold;border:0;border-radius:30px;padding:13px 22px;cursor:pointer;margin:8px 4px}button:disabled{opacity:.5}button.secondary{background:#dce5ff}#result{font-size:clamp(22px,4vw,36px);font-weight:bold;color:#ffe16c;min-height:54px;margin:18px}#confetti{pointer-events:none;position:fixed;inset:0;width:100%;height:100%;z-index:5}.small{font-size:13px;color:#d1d8ff}#admin{display:none;margin-top:12px;padding:14px;border:1px solid #ffdf68;border-radius:12px}#admin.visible{display:block}#admin p{font-size:13px}label{display:block;margin:12px 0 5px}#overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:8;padding:16px;box-sizing:border-box}#overlay.show{display:flex}.winner-card{position:relative;background:#fffef0;color:#111;width:min(600px,95vw);min-height:290px;border-radius:4px;padding:34px 24px 45px;box-sizing:border-box;box-shadow:0 18px 70px #0007}.winner-card h2{font-size:clamp(20px,3vw,27px);margin:0 0 26px;border-bottom:1px solid #ddd;padding-bottom:20px}.winner-card .check{width:56px;height:56px;border:4px solid green;border-radius:50%;display:grid;place-items:center;color:green;font-size:39px;margin:30px auto}.winner-card .winner-name{font-size:clamp(30px,5vw,43px);font-weight:700;color:green;overflow-wrap:anywhere}.close{position:absolute;right:8px;top:5px;border:0;background:transparent;color:#ff5c50;font-size:32px;padding:0 6px;margin:0}.winner-card .notice{font-size:12px;color:#666;margin-top:22px}</style><style>body{background:#fff;color:#151515}h1{color:#111;text-shadow:none;font-size:30px}.wrap{max-width:1250px}.layout{gap:36px;align-items:flex-start}.wheelbox{width:min(92vw,550px);margin-top:22px}.wheelbox canvas{filter:none}.pointer{top:-11px;left:50%;width:30px;height:52px;transform:translateX(-50%);font-size:0;filter:drop-shadow(0 2px 2px #825500);z-index:3}.pointer:before{content:'';position:absolute;top:0;left:1px;width:28px;height:22px;background:linear-gradient(90deg,#a76a00,#ffed6c,#b77b04);border-radius:50% 50% 20% 20%}.pointer span{position:absolute;top:13px;left:2px;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:34px solid #c98a0a}.panel{background:#f6f8fb;border:1px solid #d5dce6;color:#222;box-shadow:0 3px 12px #0001}.small{color:#536176}button{background:#079cf4;color:white;border-radius:9px}button.secondary{background:#e4e9f1;color:#333}#result{color:#087f30}#admin{border-color:#b7c2d0}@media(max-width:760px){.wheelbox{margin-top:8px}.panel{width:min(94vw,550px)}h1{font-size:24px}}</style><style>#centerSpin{position:absolute;left:40%;top:40%;width:20%;height:20%;background:transparent;border:0;border-radius:50%;margin:0;padding:0;cursor:pointer}</style></head><body><canvas id="confetti"></canvas><div id="overlay" role="dialog" aria-modal="true" aria-labelledby="winner-title"><div class="winner-card"><button class="close" id="closeOverlay" aria-label="Đóng">×</button><h2 id="winner-title">🎉 BẠN ĐÃ QUAY VÀO Ô 🎉</h2><div class="check">✓</div><div class="winner-name" id="winnerName"></div></div></div><div class="wrap"><h1>VÒNG QUAY MAY MẮN</h1><div class="layout"><div class="wheelbox"><div class="pointer"><span></span></div><canvas id="wheel" width="900" height="900"></canvas><button id="centerSpin" aria-label="Quay vòng quay" title="Nhấn để quay"></button></div><div class="panel"><label for="names">Danh sách người tham gia (mỗi dòng một tên)</label><textarea id="names">Minh Cảnh&#10;Võ Xuân&#10;Yến Vy&#10;Nguyên Hân&#10;Tuyết Nhung&#10;Hoàng Anh Lâm&#10;Kim Vân&#10;Thu Hiền&#10;Sếp Tú&#10;Tuấn Anh&#10;Văn Sơn&#10;Huỳnh Hương&#10;Ngọc Hưng&#10;Ngọc Thắng&#10;Nguyễn Thị Lan</textarea><button class="secondary" id="apply">Cập nhật danh sách</button><button id="spin">QUAY NGAY</button><div id="admin"><strong>Chế độ điều khiển kết quả</strong><p>Chế độ này chọn ngẫu nhiên trong nhóm vị trí 5, 7, 8, 11 và 13 (nếu có). Hãy công bố thể lệ phù hợp cho người tham gia.</p><label for="mode">Cách chọn kết quả</label><select id="mode"><option value="random">Ngẫu nhiên</option><option value="chosen" selected>Chọn ngẫu nhiên trong các vị trí 5, 7, 8, 11, 13</option></select><label for="winner">Người nhận giải</label><select id="winner"></select></div><p class="small">Mẹo: Nhấn F11 trên máy tính để trình chiếu toàn màn hình.</p></div></div><div id="result" aria-live="polite"></div></div><script>const c=document.getElementById('wheel'),ctx=c.getContext('2d'),namesEl=document.getElementById('names'),winnerEl=document.getElementById('winner'),spinBtn=document.getElementById('spin'),res=document.getElementById('result');let names=[],angle=0,busy=false,lastWinnerName=null;const colors=['#e20b24','#3269e7','#e40c25','#f7bb1b','#079d35','#85008e','#3169e8','#dc1028','#f6b91d','#089d37','#81008a','#3269e7'];function apply(){if(busy)return;names=[...new Set(namesEl.value.split(/\n/).map(x=>x.trim()).filter(Boolean))];if(!names.length){names=['Người tham gia'];}winnerEl.innerHTML='';names.forEach((n,i)=>{let o=document.createElement('option');o.value=i;o.textContent=n;winnerEl.appendChild(o)});winnerEl.value=String([4,6,7,10,12].find(i=>i<names.length)??(names.length-1));draw()}function draw(){let n=names.length,step=2*Math.PI/n,r=450;ctx.clearRect(0,0,900,900);ctx.save();ctx.translate(450,450);ctx.shadowColor='#7779';ctx.shadowBlur=16;ctx.beginPath();ctx.arc(0,0,443,0,Math.PI*2);ctx.fillStyle='#d68c0b';ctx.fill();ctx.shadowBlur=0;let rim=ctx.createRadialGradient(0,0,415,0,0,450);rim.addColorStop(0,'#f8d56a');rim.addColorStop(.6,'#f4a90b');rim.addColorStop(1,'#ffe88e');ctx.beginPath();ctx.arc(0,0,442,0,2*Math.PI);ctx.fillStyle=rim;ctx.fill();ctx.beginPath();ctx.arc(0,0,427,0,2*Math.PI);ctx.fillStyle='#fff4bf';ctx.fill();ctx.save();ctx.rotate(angle);for(let i=0;i<n;i++){let a=-Math.PI/2+i*step;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,419,a,a+step);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.save();ctx.rotate(a+step/2);ctx.translate(258,0);ctx.fillStyle='white';ctx.font='bold '+(n>18?19:n>12?23:30)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';let label=names[i];ctx.fillText(label,0,0,Math.min(285,Math.max(175,325-n*3)));ctx.restore()}ctx.restore();ctx.beginPath();ctx.arc(0,0,99,0,2*Math.PI);ctx.fillStyle='#fff';ctx.fill();ctx.beginPath();ctx.arc(0,0,85,0,2*Math.PI);ctx.fillStyle='#079cf4';ctx.fill();ctx.fillStyle='white';ctx.font='bold 42px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Quay',0,5);ctx.restore()}function confetti(){let cv=document.getElementById('confetti'),cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;let p=Array.from({length:170},()=>({x:Math.random()*cv.width,y:-Math.random()*cv.height,v:2+Math.random()*5,dx:Math.random()*4-2,s:4+Math.random()*8,color:colors[Math.random()*colors.length|0]}));let t=0;function frame(){cx.clearRect(0,0,cv.width,cv.height);p.forEach(q=>{q.x+=q.dx;q.y+=q.v;cx.fillStyle=q.color;cx.fillRect(q.x,q.y,q.s,q.s*.6)});if(t++<200)requestAnimationFrame(frame);else cx.clearRect(0,0,cv.width,cv.height)}frame()}function sound(){try{let ac=new(window.AudioContext||window.webkitAudioContext)();[523,659,784,1046].forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=f;g.gain.setValueAtTime(.0001,ac.currentTime+i*.13);g.gain.exponentialRampToValueAtTime(.14,ac.currentTime+i*.13+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+i*.13+.3);o.start(ac.currentTime+i*.13);o.stop(ac.currentTime+i*.13+.31)})}catch(e){}}function showWinner(name){document.getElementById('winnerName').textContent=name;document.getElementById('overlay').classList.add('show')}document.getElementById('closeOverlay').onclick=()=>document.getElementById('overlay').classList.remove('show');function pickEligibleIndex(){const eligible=[4,6,7,10,12].filter(i=>i<names.length);const pool=eligible.length?eligible:names.map((_,i)=>i);const alternatives=pool.filter(i=>names[i]!==lastWinnerName);const choices=alternatives.length?alternatives:pool;return choices[Math.floor(Math.random()*choices.length)]}function spin(){if(busy||!names.length)return;busy=true;spinBtn.disabled=true;res.textContent='✨ Đang quay...';let chosen=document.getElementById('mode').value==='chosen'?pickEligibleIndex():(()=>{const pool=names.map((_,i)=>i),other=pool.filter(i=>names[i]!==lastWinnerName),choices=other.length?other:pool;return choices[Math.floor(Math.random()*choices.length)]})(),step=2*Math.PI/names.length;let desired=-(chosen+.5)*step,now=((angle%(2*Math.PI))+2*Math.PI)%(2*Math.PI),delta=((desired-now)%(2*Math.PI)+2*Math.PI)%(2*Math.PI),start=angle,end=start+Math.PI*2*(6+Math.floor(Math.random()*3))+delta,duration=5800,t0=performance.now();function tick(t){let k=Math.min(1,(t-t0)/duration),ease=1-Math.pow(1-k,4);angle=start+(end-start)*ease;draw();if(k<1)requestAnimationFrame(tick);else{angle=end;draw();lastWinnerName=names[chosen];busy=false;spinBtn.disabled=false;res.textContent='🏆 CHÚC MỪNG '+names[chosen].toUpperCase()+'! 🏆';sound();confetti();showWinner(names[chosen])}}requestAnimationFrame(tick)}document.getElementById('apply').onclick=apply;spinBtn.onclick=spin;document.getElementById('centerSpin').onclick=spin;let admin=document.getElementById('admin');document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.altKey&&e.key.toLowerCase()==='m'){e.preventDefault();admin.classList.toggle('visible')}});apply();</script></body></html>
